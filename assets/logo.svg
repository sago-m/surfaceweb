<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">SurfaceWeb</title>
  <desc id="logoDesc">Abstract rounded square with SW monogram in white on a blue gradient.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#g)" />
  <g fill="#fff" font-family="Inter, Roboto, system-ui, sans-serif" font-weight="700" font-size="40" text-anchor="middle">
    <text x="50" y="60">SW</text>
  </g>
</svg>
